services:
  banco:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-nimbus}
      MYSQL_USER: ${DB_USER:-nimbus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: projeto_API/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: banco
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-nimbus}
      DB_USER: ${DB_USER:-nimbus_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  dados_mysql:
